<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .container svg { max-width: 100%; max-height: 100%; {{LOOP_STYLE}} }
</style>
</head>
<body>
  <div class="container"></div>
  <script>
    function sanitizeSvg(raw) {
      // Do not assign raw XML to innerHTML. Android WebView can treat the
      // XML declaration/source as text, which displays SVG path data on top
      // of the pet instead of rendering the image.
      var doc = new DOMParser().parseFromString(raw, 'image/svg+xml');
      var svg = doc.documentElement;
      if (!svg || svg.localName.toLowerCase() !== 'svg') return null;

      Array.prototype.slice.call(svg.querySelectorAll('script, foreignObject')).forEach(function (node) {
        node.parentNode.removeChild(node);
      });
      Array.prototype.slice.call(svg.querySelectorAll('*')).forEach(function (node) {
        Array.prototype.slice.call(node.attributes).forEach(function (attr) {
          if (/^on/i.test(attr.name) ||
              ((attr.name === 'href' || attr.name === 'xlink:href') && /^\s*javascript:/i.test(attr.value))) {
            node.removeAttribute(attr.name);
          }
        });
      });
      return document.importNode(svg, true);
    }

    function mountSvg(raw) {
      var svg = sanitizeSvg(raw);
      var container = document.querySelector('.container');
      if (!svg || !container) return;
      while (container.firstChild) container.removeChild(container.firstChild);
      container.appendChild(svg);
      readSvgMeta(svg);
    }
    function readSvgMeta(svgEl) {
      if (!svgEl) return;
      var vb = svgEl.viewBox.baseVal;
      if (vb && vb.width > 0 && vb.height > 0) {
        window._svgWidth = vb.width;
        window._svgHeight = vb.height;
      } else {
        window._svgWidth = parseFloat(svgEl.getAttribute('width')) || 0;
        window._svgHeight = parseFloat(svgEl.getAttribute('height')) || 0;
      }
      try {
        var bbox = svgEl.getBBox();
        var vb2 = svgEl.viewBox.baseVal;
        if (vb2 && vb2.width > 0 && vb2.height > 0) {
          window._visualInsets = {
            left: bbox.x - vb2.x,
            top: bbox.y - vb2.y,
            right: (vb2.x + vb2.width) - (bbox.x + bbox.width),
            bottom: (vb2.y + vb2.height) - (bbox.y + bbox.height)
          };
          window._viewBox = { x: vb2.x, y: vb2.y, width: vb2.width, height: vb2.height };
        }
      } catch(e) {}
      if (typeof window.onSvgLoaded === 'function') window.onSvgLoaded();
    }
    // Hot-swap API: fetch, sanitize, replace SVG in-place (no page reload)
    window.updatePetSvg = function(url) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onload = function() {
        if (xhr.responseText.length > 0) {
          mountSvg(xhr.responseText);
        }
      };
      xhr.send();
    };
    // Initial load
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '{{URL}}', true);
    xhr.onload = function() {
      if (xhr.responseText.length > 0) {
        mountSvg(xhr.responseText);
      }
    };
    xhr.send();
  </script>
  {{ANIM_END_SCRIPT}}
</body>
</html>
