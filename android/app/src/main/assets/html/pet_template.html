<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .container img, .container svg { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head><body>
<div class="container"></div>
<script>
(function () {
  'use strict';
  var generation = 0;
  var activeRequest = null;
  var container = document.querySelector('.container');
  window._petLoadStatus = 'starting';
  window._lastRenderedAsset = '';
  function notifyReady(url, width, height) {
    window._svgWidth = Math.round(width) || 0;
    window._svgHeight = Math.round(height) || 0;
    window._lastRenderedAsset = url;
    window._petLoadStatus = 'ready';
    if (typeof window.onSvgLoaded === 'function') window.onSvgLoaded();
  }
  function swapNode(node) {
    // Keep the old frame visible until the new resource is ready.
    while (container.firstChild) container.removeChild(container.firstChild);
    container.appendChild(node);
  }
  function sanitizeSvg(raw) {
    var doc = new DOMParser().parseFromString(raw, 'image/svg+xml');
    var svg = doc.documentElement;
    if (!svg || svg.localName.toLowerCase() !== 'svg') throw Error('Invalid SVG');
    Array.prototype.slice.call(svg.querySelectorAll('script, foreignObject')).forEach(function (node) {
      node.parentNode.removeChild(node);
    });
    Array.prototype.slice.call(svg.querySelectorAll('*')).forEach(function (node) {
      Array.prototype.slice.call(node.attributes).forEach(function (attr) {
        if (/^on/i.test(attr.name) ||
            ((attr.name === 'href' || attr.name === 'xlink:href') && /^\s*javascript:/i.test(attr.value))) {
          node.removeAttribute(attr.name);
        }
      });
    });
    return document.importNode(svg, true);
  }
  window.updatePetSvg = function (url) {
    // SVG and APNG require different loaders. A previous SVG-only document
    // cannot parse an APNG as XML, which used to leave the idle pet on screen.
    var token = ++generation;
    if (activeRequest) { activeRequest.abort(); activeRequest = null; }
    window._petLoadStatus = 'loading';
    window._visualInsets = null;
    window._viewBox = null;
    if (/\.apng(?:[?#]|$)/i.test(url) || /\.png(?:[?#]|$)/i.test(url)) {
      var img = new Image();
      img.onload = function () {
        if (token !== generation) return;
        swapNode(img);
        notifyReady(url, img.naturalWidth, img.naturalHeight);
      };
      img.onerror = function () {
        if (token === generation) window._petLoadStatus = 'image-error';
      };
      img.src = url;
      return;
    }
    var xhr = new XMLHttpRequest();
    activeRequest = xhr;
    xhr.open('GET', url, true);
    xhr.onload = function () {
      if (token !== generation) return;
      activeRequest = null;
      try {
        if (xhr.status !== 200 && xhr.status !== 0) throw Error('HTTP ' + xhr.status);
        var svg = sanitizeSvg(xhr.responseText);
        var vb = svg.viewBox.baseVal;
        var width = vb && vb.width > 0 ? vb.width : (parseFloat(svg.getAttribute('width')) || 0);
        var height = vb && vb.height > 0 ? vb.height : (parseFloat(svg.getAttribute('height')) || 0);
        swapNode(svg);
        try {
          var bbox = svg.getBBox();
          if (vb && vb.width > 0 && vb.height > 0) {
            window._visualInsets = {
              left: bbox.x - vb.x, top: bbox.y - vb.y,
              right: vb.x + vb.width - bbox.x - bbox.width,
              bottom: vb.y + vb.height - bbox.y - bbox.height
            };
            window._viewBox = { x: vb.x, y: vb.y, width: vb.width, height: vb.height };
          }
        } catch (_) {}
        notifyReady(url, width, height);
      } catch (_) { window._petLoadStatus = 'svg-error'; }
    };
    xhr.onerror = function () {
      if (token === generation) window._petLoadStatus = 'network-error';
    };
    xhr.send();
  };
  window.updatePetSvg('{{URL}}');
})();
</script></body></html>
